[package]
name = "tally-io"
version = "0.1.0"
description = "Tally.io — Offline-first POS and Business Management"
authors = ["Ken Kipkirui Tuei <kentuei05@gmail.com>"]
license = "UNLICENSED"
repository = "https://github.com/KenTuei/tally-io"
edition = "2021"
rust-version = "1.75"

[lib]
name = "tally_io_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "tally-io"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["devtools"] }
tauri-plugin-shell = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-notification = "2.0"
tauri-plugin-process = "2.0"
tauri-plugin-updater = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
